<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.76" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42.24" fill="url(#bgGrad)" />

  <!-- Subtle glow orb -->
  <circle cx="96" cy="86.4" r="67.19999999999999" fill="url(#emeraldGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Gatepass Shield / Pass Emblem -->
  <g transform="translate(38.400000000000006, 34.56) scale(0.2304)">
    <!-- Outer Shield Frame -->
    <path d="M250 40 L420 110 L420 280 C420 380 340 450 250 480 C160 450 80 380 80 280 L80 110 Z" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Inner Gate/Card Graphic -->
    <rect x="150" y="160" width="200" height="140" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="12" />
    
    <!-- Pass lines -->
    <line x1="180" y1="200" x2="260" y2="200" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" />
    <line x1="180" y1="235" x2="320" y2="235" stroke="#6ee7b7" stroke-width="10" stroke-linecap="round" />
    <line x1="180" y1="265" x2="240" y2="265" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    
    <!-- Keyhole/Security Check -->
    <circle cx="250" cy="355" r="22" fill="#34d399" />
    <polygon points="238,360 262,360 270,400 230,400" fill="#34d399" />
  </g>
</svg>